name: deploy-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute image tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend images
        run: |
          for svc in backend/services/*/; do
            name=$(basename "$svc")
            image="ghcr.io/${{ github.repository }}/$name:${{ steps.meta.outputs.tag }}"
            docker buildx build \
              --file "$svc/Dockerfile" \
              --tag "$image" \
              --tag "ghcr.io/${{ github.repository }}/$name:latest" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --push \
              "$svc"
          done

      - name: Build & push frontend image
        run: |
          image="ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}"
          docker buildx build \
            --file frontend/Dockerfile \
            --tag "$image" \
            --tag "ghcr.io/${{ github.repository }}/frontend:latest" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose files
        run: |
          scp docker-compose.yml docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}/

      - name: Deploy on VPS
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.image-tag }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ secrets.VPS_DEPLOY_PATH }} && \
             echo '${{ secrets.GHCR_PULL_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             export IMAGE_TAG=$IMAGE_TAG && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d && \
             docker image prune -f"

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ secrets.HEALTH_URL }}" >/dev/null; then
              echo "Health OK"
              exit 0
            fi
            echo "Waiting for health... ($i/30)"
            sleep 5
          done
          echo "::error::Service did not become healthy"
          exit 1
