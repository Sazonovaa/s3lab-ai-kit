# CI: drift-гейт единого описания AI-kit.
#
# Источник правды — frontmatter .ai/skills, .ai/subagents, .ai/policies, .ai/rules.
# Сгенерированные .claude/* , .cursor/* , .ai/routes.generated.md и блоки
# AIKIT:ROUTES (router.md) / AIKIT:INDEX (AGENTS.md) должны совпадать с источником.
# Джоба пересобирает в памяти и падает при расхождении (--check). Linux + Node,
# без внешних зависимостей; проверка не зависит от EOL.
#
# workflow.rules — единственное место, где решается, создавать ли pipeline.
# Pipeline создаётся ТОЛЬКО для MR и веток develop/main; в любом созданном
# pipeline всегда есть джоба ниже (у джобы нет своих rules → не бывает «пустого»
# pipeline или ожидания несуществующей джобы).

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - validate

ai-kit-drift-check:
  stage: validate
  image: node:20-alpine
  interruptible: true
  script:
    - node --version
    - node scripts/ai/build-ai-kit.mjs --check
